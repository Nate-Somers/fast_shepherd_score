# Conda environment for shepherd-score with the SVML-enabled numba build used by the CPU kernels.
# SVML needs numba <= 0.59 + icc_rt from the `numba` channel (later numba dropped it); without
# SVML the CPU kernels still run, several times slower, and warn once.
# Check:  python -c "import numba.core.config as c; print(c.USING_SVML)"
# GPU (Triton) kernels are not in this env: install a CUDA build of torch plus
# `pip install "shepherd-score[gpu]"` on top.
name: shepherd_score
channels:
  - numba
  - conda-forge
dependencies:
  - python=3.10
  - numba=0.59.1        # last numba with the SVML-patched LLVM
  - llvmlite=0.42       # pinned by numba 0.59; SVML-built
  - icc_rt              # numba channel: provides libsvml + enables SVML in llvmlite
  - numpy=1.26          # numba 0.59 caps numpy < 1.27
  - pytorch=*=*cpu*     # CPU build; add a CUDA torch via pip for the GPU (triton) path
  - rdkit               # conformer generation
  - scipy>=1.10
  - pandas>=2.0
  - xtb                 # xTB partial charges / ESP
  - pip:
    - open3d>=0.18      # mesh surface generation
    - py3Dmol>=2.1.0
    - molscrub
    - tqdm
    - threadpoolctl     # runtime MKL/OMP cap for the multi-GPU workers
    - pytest            # the suite runs off pytest.ini (no --cov, so pytest-cov is optional)
    - meeko             # docking
    - vina==1.2.5       # docking
